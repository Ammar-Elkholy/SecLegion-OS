# Live mode: the screen may power off, but it is never locked (spec A3).
# No lock_cmd, no before_sleep_cmd, no hyprlock.
general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
