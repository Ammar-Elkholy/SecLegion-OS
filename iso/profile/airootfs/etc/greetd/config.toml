# Live mode only: seclegion-live.target wants greetd.service; no other target does.
[terminal]
vt = 1

# Logout falls back to the greeter.
[default_session]
command = "cage -s -- regreet"
user = "greeter"

# The live user starts straight into the desktop, with no password. The wrapper completes the
# prebuilt home from /etc/skel and starts Hyprland through uwsm, as the installed system does.
[initial_session]
command = "/usr/local/bin/seclegion-live-session"
user = "seclegion-live"
