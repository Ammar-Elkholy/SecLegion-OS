# Modules for the ISO volume and the usual partition and file systems.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod exfat
insmod udf

# Graphics output. The SecLegion theme is built at build time into themes/seclegion/
# (not committed); without it the menu falls back to the plain console.
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    set gfxpayload=keep
    if [ -f "${prefix}/themes/seclegion/theme.txt" ]; then
        insmod gfxterm
        insmod gfxmenu
        insmod png
        set theme="${prefix}/themes/seclegion/theme.txt"
        terminal_input console
        terminal_output gfxterm
    else
        terminal_input console
        terminal_output console
    fi
fi

# Keep the serial terminal (headless boxes and the VM harness read it).
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Install is the default; the menu waits 10 s.
set default=seclegion-install
set timeout=10
set timeout_style=menu

# Menu entries (six): Install, Try Live, Rescue, Memory Test, UEFI Firmware Settings, Safe Graphics.

menuentry 'Install SecLegion OS' --hotkey i --id 'seclegion-install' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 modprobe.blacklist=nouveau quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto seclegion.mode=install systemd.unit=seclegion-install.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'Try SecLegion OS (Live)' --hotkey l --id 'seclegion-live' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto seclegion.mode=live systemd.unit=seclegion-live.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'Rescue' --hotkey r --id 'seclegion-rescue' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 modprobe.blacklist=nouveau quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto seclegion.mode=rescue systemd.unit=seclegion-rescue.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'Memory Test (Memtest86+)' --hotkey m --id 'seclegion-memtest' {
    if [ -f /boot/memtest86+/memtest.efi ]; then
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi console=ttyS0,115200
    else
        echo 'Memtest86+ is not on this medium.'
        sleep 3
    fi
}

menuentry 'UEFI Firmware Settings' --hotkey u --id 'seclegion-firmware' {
    fwsetup
}

# Safe Graphics (and the verbose install, which shows every boot message): the kernel's own framebuffer only, for GPUs that fail to start.
submenu 'Safe Graphics' --hotkey s --id 'seclegion-safe' {
    menuentry 'Install (safe graphics)' --id 'seclegion-safe-install' {
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto nomodeset seclegion.mode=install systemd.unit=seclegion-install.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry 'Live (safe graphics)' --id 'seclegion-safe-live' {
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto nomodeset seclegion.mode=live systemd.unit=seclegion-live.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry 'Install (verbose boot)' --id 'seclegion-verbose-install' {
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 modprobe.blacklist=nouveau seclegion.mode=install systemd.unit=seclegion-install.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
}
