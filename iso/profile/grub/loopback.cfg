# https://www.supergrubdisk.org/wiki/Loopback.cfg
# Loopback boot of the ISO file from another disk's GRUB.

search --no-floppy --set=seclegion_img_dev --file "${iso_path}"
probe --set seclegion_img_dev_uuid --fs-uuid "${seclegion_img_dev}"

# Install is the default; the menu waits 10 s.
set default=seclegion-install
set timeout=10
set timeout_style=menu

# Menu entries (six): Install, Try Live, Rescue, Memory Test, UEFI Firmware Settings, Safe Graphics.

menuentry 'Install SecLegion OS' --hotkey i --id 'seclegion-install' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${seclegion_img_dev_uuid} img_loop="${iso_path}" console=ttyS0,115200 console=tty0 modprobe.blacklist=nouveau quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto seclegion.mode=install systemd.unit=seclegion-install.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'Try SecLegion OS (Live)' --hotkey l --id 'seclegion-live' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${seclegion_img_dev_uuid} img_loop="${iso_path}" console=ttyS0,115200 console=tty0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto seclegion.mode=live systemd.unit=seclegion-live.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'Rescue' --hotkey r --id 'seclegion-rescue' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${seclegion_img_dev_uuid} img_loop="${iso_path}" console=ttyS0,115200 console=tty0 modprobe.blacklist=nouveau quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto seclegion.mode=rescue systemd.unit=seclegion-rescue.target %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'Memory Test (Memtest86+)' --hotkey m --id 'seclegion-memtest' {
    if [ -f /boot/memtest86+/memtest.efi ]; then
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    else
        echo 'Memtest86+ is not on this medium.'
        sleep 3
    fi
}

menuentry 'UEFI Firmware Settings' --hotkey u --id 'seclegion-firmware' {
    fwsetup
}

# Safe Graphics: the kernel's own framebuffer only, for GPUs that fail to start.
submenu 'Safe Graphics' --hotkey s --id 'seclegion-safe' {
    menuentry 'Install (safe graphics)' --id 'seclegion-safe-install' {
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${seclegion_img_dev_uuid} img_loop="${iso_path}" console=ttyS0,115200 console=tty0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto nomodeset seclegion.mode=install systemd.unit=seclegion-install.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry 'Live (safe graphics)' --id 'seclegion-safe-live' {
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${seclegion_img_dev_uuid} img_loop="${iso_path}" console=ttyS0,115200 console=tty0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto nomodeset seclegion.mode=live systemd.unit=seclegion-live.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry 'Install (verbose boot)' --id 'seclegion-verbose-install' {
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${seclegion_img_dev_uuid} img_loop="${iso_path}" console=ttyS0,115200 console=tty0 modprobe.blacklist=nouveau seclegion.mode=install systemd.unit=seclegion-install.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
}
