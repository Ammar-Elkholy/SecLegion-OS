# Archive-pinned pacman configuration for the SecLegion ISO build and the offline cache
# (spec A13, plan r13 J2a). Official core and extra only, from one dated snapshot of the
# Arch Linux Archive: every build sees the same package set.
#
# Bumping the date is a deliberate change: the container image digest in
# tools/docker-build.sh moves with it, and nothing else may carry a date. The build reads
# the date from the Server lines below (tools/container-build.sh).
#
# Packages must carry a valid signature from a key the keyring trusts (Required). Only the
# sync databases may be unsigned (DatabaseOptional): that is what Arch ships, and the
# signed package is what is checked.
#
# [seclegion] is the one other repository: our own signed file repository, embedded in the ISO
# (tools/build-pkgs makes it, tools/container-build.sh copies it in). It comes LAST, below core
# and extra, so it can never shadow an official package, and it is the only section with its own
# SigLevel: the database must be signed too (DatabaseRequired). Its key comes from the
# seclegion-keyring package (pacman-key --populate), nowhere else. The container build strips
# this section for the package resolve and points Server at the build tree for mkarchiso.

[options]
HoldPkg = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
SigLevel = Required DatabaseOptional

[core]
Server = https://archive.archlinux.org/repos/2026/10/15/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/15/$repo/os/$arch

[seclegion]
SigLevel = Required DatabaseRequired
Server = file:///opt/seclegion/cache/seclegion
