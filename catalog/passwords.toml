# Tier-1 catalog, batch 2: password cracking and credential tools. Schema and rules: catalog/README.md.

[[tool]]
name = "john"
package = "john"
source = "arch-extra"
category = "passwords"
purpose = "John the Ripper (jumbo): offline password hash cracking with wordlist, rules and incremental modes."
privileges = "none"
privileges_why = "Reads hash files and writes its own session files as the user; no raw sockets."
safe_test = ["john", "--help"]
safe_test_expect = "John the Ripper"
removal = "sudo pacman -Rns john"
update_policy = "Follows the Arch package; updated with the system (pacman -Syu). No pinning."
docs = "john --help; https://www.openwall.com/john/doc/"
licence = "GPL-2.0-only"
needs_internet = false

[[tool]]
name = "hashcat"
package = "hashcat"
source = "arch-extra"
category = "passwords"
purpose = "GPU/CPU-accelerated offline password hash cracking."
privileges = "none"
privileges_why = "Offline computation as the user; GPU access goes through the render/video device nodes, not root."
safe_test = ["hashcat", "--version"]
safe_test_expect = "^v\\d+\\.\\d+"
removal = "sudo pacman -Rns hashcat"
update_policy = "Follows the Arch package; updated with the system (pacman -Syu). GPU runtimes come from the hardware profile, not from this package. The test does not run a benchmark."
docs = "hashcat --help; man hashcat; https://hashcat.net/wiki/"
licence = "MIT"
needs_internet = false

[[tool]]
name = "hydra"
package = "hydra"
source = "arch-extra"
category = "passwords"
purpose = "Online login brute-forcer for many protocols (ssh, ftp, http forms, smb, ...)."
privileges = "none"
privileges_why = "Ordinary TCP client connections; no raw sockets."
safe_test = ["hydra", "-h"]
safe_test_expect = "Hydra v\\d+\\.\\d+"
safe_test_exit = 255
removal = "sudo pacman -Rns hydra"
update_policy = "Follows the Arch package; updated with the system (pacman -Syu). No pinning. The test prints the help/banner only (hydra -h exits 255 by design) and attacks nothing."
docs = "hydra -h; man hydra; https://github.com/vanhauser-thc/thc-hydra"
licence = "AGPL-3.0-or-later"
needs_internet = false

[[tool]]
name = "responder"
package = "responder"
source = "seclegion"
category = "passwords"
purpose = "LLMNR/NBT-NS/mDNS poisoner and rogue auth server that captures network credential hashes."
privileges = "root"
privileges_why = "Binds privileged ports (53, 80, 137, 389, 445, ...) on a chosen interface."
safe_test = ["responder", "--help"]
safe_test_expect = "(?i)usage"
removal = "sudo pacman -Rns responder"
update_policy = "Vendored clean-chroot build in the seclegion repo (spec A8); not in the Arch repositories. Updated by the SecLegion owner via tools/check-updates; source and trust recorded in docs/third-party.md."
docs = "responder --help; https://github.com/lgandx/Responder"
licence = "GPL-3.0-only"
needs_internet = false

[[tool]]
name = "impacket"
package = "impacket"
source = "arch-extra"
category = "passwords"
purpose = "Python library and example scripts for SMB, MSRPC, Kerberos and NTLM (secretsdump, psexec, GetNPUsers, ...)."
privileges = "none"
privileges_why = "Ordinary TCP clients; the scripts need no local privileges."
safe_test = ["impacket-secretsdump", "-h"]
safe_test_expect = "(?i)usage"
removal = "sudo pacman -Rns impacket"
update_policy = "Follows the Arch package; updated with the system (pacman -Syu). No pinning."
docs = "impacket-<script> -h; https://github.com/fortra/impacket"
licence = "Apache-2.0"
needs_internet = false
