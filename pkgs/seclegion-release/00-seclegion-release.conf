# /etc/os-release is SecLegion's. The 00- prefix sorts before systemd's etc.conf, whose own
# /etc/os-release line would otherwise win (tmpfiles keeps the first line per path).
# /usr/lib/os-release stays Arch's as technical attribution.
L+ /etc/os-release - - - - ../usr/lib/seclegion/os-release
