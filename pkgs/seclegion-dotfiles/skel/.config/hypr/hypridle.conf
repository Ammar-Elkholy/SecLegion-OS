# The session's idle daemon (seclegion-hypridle.service reads this file). It turns logind's Lock
# signal into hyprlock: the auto-lock timer of seclegion-idle.service and suspend both send it
# (`loginctl lock-session`). Without this file hypridle exits and nothing locks on idle.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}
