version = 1

# Markdown prose, config and the stock archiso profile carry no inline headers.
[[annotations]]
path = ["**/*.md", "Makefile", ".gitignore", "LICENSE", "REUSE.toml", "pytest.ini", "ruff.toml", "requirements-dev.txt", "evidence/**/result.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# Harness output recorded as evidence (hashed in result.json, committed with it). Listed
# explicitly: they are binary/log output with no place for an inline header.
[[annotations]]
path = ["evidence/**/serial.log", "evidence/**/screen.png", "evidence/**/qemu.stderr", "evidence/**/theme.log"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# Placeholder only: copied unmodified from archiso's releng config, replaced in M1.
[[annotations]]
path = "iso/profile/**"
precedence = "override"
SPDX-FileCopyrightText = "The archiso contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Owner-supplied branding sources at the repository root. Redistribution licence is not
# decided yet (docs/branding.md, decision needed); until then: all rights reserved.
[[annotations]]
path = ["*.png", "SecLegion_Wallpaper"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ammar Elkholy"
SPDX-License-Identifier = "LicenseRef-SecLegion-Owner-Asset"

# Settings test fixtures: fake sysfs trees and golden config text, bare values with no place for a header.
[[annotations]]
path = ["desktop/settings/tests/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# Our own profile definition and GRUB menu (MIT). Later annotations win over the iso/profile/** one above.
[[annotations]]
path = ["iso/profile/profiledef.sh", "iso/profile/grub/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# The ReGreet sheet inside the ISO profile is generated by the theme engine (MIT), not part of the archiso stock files.
[[annotations]]
path = "iso/profile/airootfs/etc/greetd/regreet.css"
precedence = "override"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# J2b (plan r13): our own users, privilege, target and kiosk files inside the ISO profile (MIT).
# The account files take no comments, so they are listed here; the rest also carry inline headers.
[[annotations]]
path = [
  "iso/profile/airootfs/etc/passwd",
  "iso/profile/airootfs/etc/shadow",
  "iso/profile/airootfs/etc/group",
  "iso/profile/airootfs/etc/gshadow",
  "iso/profile/airootfs/etc/sudoers.d/**",
  "iso/profile/airootfs/etc/pam.d/seclegion-kiosk",
  "iso/profile/airootfs/etc/greetd/config.toml",
  "iso/profile/airootfs/etc/systemd/system/seclegion-*",
  "iso/profile/airootfs/home/seclegion-live/**",
  "iso/profile/airootfs/usr/share/seclegion/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# Recorded progress ledger and test fixtures: bare data (JSON, plain text, vendor captures) with no place for a header.
[[annotations]]
path = ["docs/progress.toml", "desktop/theme/tests/fixtures/**", "tests/install/fixtures/**", "tests/unit/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"

# Engine exports (byte-compared against the engine by tests, so no extra inline lines): copyright only here;
# the licence stays in each file's own header or sidecar.
[[annotations]]
path = ["desktop/theme/default/**", "desktop/theme/default-colors.css"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Elkholy and SecLegion contributors"
SPDX-License-Identifier = "MIT"
