# ==============================================================================
# Calamares Settings — SecLegion OS by Ammar Elkholy
# ==============================================================================
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: seclegion
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
