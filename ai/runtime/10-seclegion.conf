# Drop-in for Arch's ollama.service, shipped by seclegion-ai. The unit itself is NOT enabled by the
# package (no wants link); `seclegion-ai enable` does that on the user's request.
[Service]
# Loopback only: nothing off-host can reach the API.
Environment=OLLAMA_HOST=127.0.0.1:11434
# Never delete blobs on start: a model is only removed by `seclegion-ai remove`.
Environment=OLLAMA_NOPRUNE=1
# Refuse cloud-backed models and web-search features (ollama >= 0.12). Ollama has no telemetry setting
# of its own; the only outbound traffic is the registry, when the user pulls a model.
Environment=OLLAMA_NO_CLOUD=1
