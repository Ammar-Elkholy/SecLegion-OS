# SPDX-License-Identifier: MIT
# generated by seclegion-theme; do not edit
palette = "seclegion"
add_newline = true
command_timeout = 500
format = """
[╭─](fg:accent2)${custom.vpn}${env_var.TARGET}$username$hostname$directory$git_branch$git_status$docker_context$python$rust$golang$cmd_duration$status
[╰─❯](bold fg:accent) """

[username]
show_always = true
style_user = "bold fg:accent2 bg:surface"
style_root = "bold fg:crit bg:surface"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "fg:text bg:surface"
format = "[@$hostname ]($style)"

[directory]
style = "bold fg:accent bg:surface2"
format = "[ $path ]($style)"
truncation_length = 3

[git_branch]
style = "fg:accent2 bg:surface"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:warn bg:surface"
format = "[$all_status$ahead_behind ]($style)"

[docker_context]
style = "fg:accent2 bg:surface"
format = "[ $symbol$context ]($style)"

[python]
style = "fg:warn bg:surface"
format = "[ $symbol$version ]($style)"

[rust]
style = "fg:err bg:surface"
format = "[ $symbol$version ]($style)"

[golang]
style = "fg:accent2 bg:surface"
format = "[ $symbol$version ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:muted bg:surface"
format = "[ took $duration ]($style)"

[status]
disabled = false
style = "bold fg:crit"
format = "[ ✘ $status ]($style)"

[env_var.TARGET]
variable = "TARGET"
style = "bold fg:err bg:surface"
format = "[ ◎ $env_value ]($style)"

[custom.vpn]
command = "ip -4 -o addr show dev tun0 | awk '{print $4}' | cut -d/ -f1"
when = "ip link show tun0 >/dev/null 2>&1"
style = "bold fg:ok bg:surface"
format = "[ VPN $output ]($style)"

[palettes.seclegion]
bg = "#050f0e"
surface = "#0b1e1c"
surface2 = "#12302c"
text = "#e0fff4"
muted = "#8fb5ab"
accent = "#00ff88"
accent2 = "#00f0ff"
border_active = "#00ff88"
border_inactive = "#0b1e1c"
ok = "#3ddc84"
warn = "#ffcc66"
err = "#ff6666"
crit = "#ff2266"
ansi0 = "#12302c"
ansi1 = "#ff6666"
ansi2 = "#3ddc84"
ansi3 = "#ffcc66"
ansi4 = "#6ea8ff"
ansi5 = "#d58cff"
ansi6 = "#00f0ff"
ansi7 = "#c8e6dd"
ansi8 = "#6f9a90"
ansi9 = "#ff2266"
ansi10 = "#00ff88"
ansi11 = "#ffe08a"
ansi12 = "#94c0ff"
ansi13 = "#e4b0ff"
ansi14 = "#7ffaff"
ansi15 = "#e0fff4"
