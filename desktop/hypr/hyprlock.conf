# SecLegion lock screen (hyprlock 0.9.x). Colours come from the seclegion-theme
# tokens in the sourced file, never from literals, so a wallpaper change retints
# the lock screen and the password text always keeps its contrast.
source = ~/.local/state/seclegion/theme/current/hyprlock-colors.conf

background {
    monitor =
    path = ~/.cache/wallpaper_frame.png
    blur_size = 5
    blur_passes = 1
}

# Time
label {
    monitor =
    text = $TIME
    color = $sl_text
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:3600000] date "+%a %b %d"
    color = $sl_muted
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 40
    halign = center
    valign = center
}

# Password input. font_color draws the typed dots: left unset, hyprlock falls
# back to a dark default and the dots vanish on the dark field.
input-field {
    monitor =
    size = 320, 55

    outline_thickness = 3
    rounding = 12

    inner_color = $sl_surface
    outer_color = $sl_accent
    check_color = $sl_warn
    fail_color = $sl_crit
    capslock_color = $sl_warn
    numlock_color = $sl_warn
    font_color = $sl_text

    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    placeholder_text = Enter password...
    font_family = JetBrainsMono Nerd Font
    font_size = 18

    position = 0, -10
    halign = center
    valign = center
}
