# Generated by SecLegion Settings. Do not edit: change it with seclegion-set or the Settings app.
# Include it once from your own hypridle.conf with:  source = ~/.config/seclegion/idle.conf
# sl-state: lock=3 screen_off=5 suspend_battery=10 suspend_ac=30 lock_before_sleep=off

general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
# lock the session
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}
# screen off
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
# suspend on battery only (AC guard)
listener {
    timeout = 600
    on-timeout = sh -c '(cat /sys/class/power_supply/AC*/online /sys/class/power_supply/ADP*/online; grep -lxE "Mains|USB" /sys/class/power_supply/*/type | sed "s|/type|/online|" | xargs -r cat) 2>/dev/null | grep -qx 1 || systemctl suspend'
}
# suspend on AC only
listener {
    timeout = 1800
    on-timeout = sh -c '(cat /sys/class/power_supply/AC*/online /sys/class/power_supply/ADP*/online; grep -lxE "Mains|USB" /sys/class/power_supply/*/type | sed "s|/type|/online|" | xargs -r cat) 2>/dev/null | grep -qx 1 && systemctl suspend'
}
